<!DOCTYPE html>
<html lang="{{ blog.language }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>{% block title %}{{ blog.title }}{% endblock %}</title>
	{% block description %}{% if blog.description %}<meta name="description" content="{{ blog.description }}">{% endif %}{% endblock %}
	<style>
		:root {
			color-scheme: light dark;
			--background: #ffffff;
			--foreground: #1f2937;
			--muted: #6b7280;
			--accent: #2563eb;
			--surface: #f3f4f6;
			--border: #e5e7eb;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--background: #111827;
				--foreground: #e5e7eb;
				--muted: #9ca3af;
				--accent: #93c5fd;
				--surface: #1f2937;
				--border: #374151;
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			max-width: 52rem;
			margin: 0 auto;
			padding: 2rem 1.25rem 4rem;
			background: var(--background);
			color: var(--foreground);
			font: 1.05rem/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
		}

		a {
			color: var(--accent);
		}

		body > header {
			margin-bottom: 2.5rem;
			padding-bottom: 1rem;
			border-bottom: 1px solid var(--border);
		}

		body > header a {
			color: var(--foreground);
			font-weight: 700;
			letter-spacing: -0.02em;
			text-decoration: none;
		}

		h1, h2, h3 {
			line-height: 1.2;
			letter-spacing: -0.02em;
		}

		.page-header {
			margin-bottom: 2.5rem;
		}

		.page-header h1 {
			margin: 0 0 0.5rem;
			font-size: clamp(2rem, 6vw, 2.75rem);
		}

		.page-header .description {
			max-width: 42rem;
			margin: 0;
			font-size: 1.15rem;
		}

		time, .description, .post-meta {
			color: var(--muted);
		}

		.post-meta {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
			align-items: center;
			margin: 0.75rem 0 0;
			font-size: 0.95rem;
		}

		.post-list {
			display: grid;
			gap: 2.5rem;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.post-list h2 {
			margin: 0 0 0.35rem;
			font-size: 1.45rem;
		}

		.post-list h2 a {
			text-decoration: none;
		}

		.post-list p {
			margin: 0.35rem 0 0;
		}

		pre {
			overflow-x: auto;
			padding: 1rem;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 0.5rem;
		}

		code {
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
		}

		blockquote {
			margin-left: 0;
			padding-left: 1rem;
			border-left: 4px solid var(--border);
			color: var(--muted);
		}

		img, video {
			max-width: 100%;
			height: auto;
		}

		hr {
			border: 0;
			border-top: 1px solid var(--border);
		}

		footer {
			margin-top: 4rem;
			padding-top: 1rem;
			border-top: 1px solid var(--border);
			color: var(--muted);
			font-size: 0.95rem;
		}
	</style>
	<link rel="stylesheet" href="{{ static_root }}style.css">
</head>
<body>
	<header>
		<a href="{{ home_url|safe }}">{{ blog.title }}</a>
	</header>
	<main>
		{% block content %}{% endblock %}
	</main>
	{% if blog.author %}
	<footer>
		<p>&copy; {{ year }} {{ blog.author }}</p>
	</footer>
	{% endif %}
</body>
</html>

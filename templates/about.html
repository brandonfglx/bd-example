{% extends "base.html" %}

{% block title %}About - {{ blog.title }}{% endblock %}

{% block content %}
{% if tailwind %}
<article>
	<header class="mb-10">
		<h1 class="text-4xl font-bold tracking-tight">About</h1>
	</header>
	<div class="prose prose-neutral max-w-none dark:prose-invert">
		{{ content|safe }}
	</div>
</article>
{% else %}
<article>
	<header class="page-header">
		<h1>About</h1>
	</header>
	<div class="content">
		{{ content|safe }}
	</div>
</article>
{% endif %}
{% endblock %}
